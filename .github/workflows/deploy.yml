# Builds the site and publishes it to GitHub Pages.
# Runs on every push to main, or manually from the Actions tab.
# Requires: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
#
# The base path comes from GitHub Pages itself: "/" when a custom domain
# (echoish.lol) is set in Settings -> Pages, "/echoish/" when the site is served
# from <user>.github.io/echoish. So the build always matches where it's hosted.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      # tsc + vite build + 404.html SPA fallback + drive-links.json redirect pages
      - run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
